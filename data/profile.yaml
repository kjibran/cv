research_focus:
  - Physics-informed and data-driven environmental modelling, including physics-informed neural networks
  - Data assimilation, inverse modelling of emissions and uncertainty quantification
  - Atmospheric dispersion across scales, from street canyons to national exposure models (Gaussian, box, Lagrangian, Eulerian, CFD)
  - Integration of satellite, in situ and mobile observations into modelling frameworks
  - Operational air quality forecasting and scientific software at national scale
  - Environmental noise modelling and assessment
  - Machine learning for atmospheric composition, noise and exposure modelling
  - Climate and air quality interactions, and greenhouse gas monitoring

positions:
  - period: 2024–present
    role: Docent (Associate Professor)
    place: Department of Environmental and Biological Sciences, University of Eastern Finland, Kuopio, Finland
    points:
      - Teaching, research collaboration and doctoral supervision.
  - period: 2023–present
    role: Researcher (Assistant Professor)
    place: Department of Environmental Science, Aarhus University, Roskilde, Denmark
    points:
      - Developed core scientific and software components of ByensLuft, Copenhagen's operational air quality forecasting platform with 4-day forecasts, used by more than 17,000 citizens through web and mobile apps (Python, PostgreSQL/PostGIS, PostgREST).
      - Developed and applied national and street-scale dispersion models (AirGIS, OSPM, OML, OML-Highway), producing pollution maps for all state roads in Denmark.
      - Lead a Google Research Scholar project on physics-informed neural networks for hyperlocal ultrafine particle prediction.
      - Led the first systematic evaluation of the Nordic and European road traffic noise standards Nord2000, RTN-96 and CNOSSOS-EU against field measurements in Denmark.
      - Led exposure assessment for national Danish cohort studies on air pollution, noise and health, contributing to more than 20 peer-reviewed publications.
  - period: 2019–2022
    role: Postdoctoral Fellow
    place: Department of Environmental Science, Aarhus University, Roskilde, Denmark
    points:
      - Co-developed methods for hyperlocal mapping of nitrogen dioxide, black carbon and ultrafine particles with Google Street View cars in Amsterdam and Copenhagen. Results are public in Google's Environmental Insights Explorer (Air Quality Labs).
      - Generated address-level exposure estimates with AirGIS for large Danish population cohorts.
      - Evaluated low- and mid-cost air quality sensors, contributing to published guidance on sensor performance and deployment.
  - period: 2016–2018
    role: PhD Fellow
    place: Department of Environmental Science, Aarhus University, Roskilde, Denmark
    points:
      - Developed and validated a new generation of AirGIS, Denmark's national GIS-based dispersion and exposure modelling system, rebuilt on open-source PostgreSQL/PostGIS for national-scale applications.
      - Extended AirGIS to environmental noise, creating a combined air pollution and noise modelling framework.
  - period: "2017"
    role: Visiting Researcher (PhD research stay)
    place: Department of Chemical Engineering, Texas A&M University at Qatar, Doha, Qatar
    points: []
  - period: 2013–2015
    role: Lecturer in Physics and Engineering Physics
    place: Dawood University of Engineering and Technology, Karachi, Pakistan
    points: []
  - period: 2011–2013
    role: Lecturer
    place: Pakistan Air Force Degree College, Karachi, Pakistan
    points: []

