person:
  name: Jibran Khan
  title: Atmospheric scientist working on numerical modelling and physics-informed, data-driven methods
  location: Copenhagen, Denmark
  photo: photo.jpg                            # in the data folder, square works best
  highlight_name: Khan, J.                   # how your name appears in author lists, shown in bold
  email: jk.envs@gmail.com                   # shown as a protected link, never as plain text in the page
  bio: >-
    I am a computational environmental scientist at Aarhus University. I develop numerical
    models, data assimilation and physics-informed machine learning for air pollution and
    environmental noise, combining physical process models with satellite, in situ and
    mobile observations. I build operational systems used by authorities and the public,
    and lead externally funded research in Denmark and Europe.

